1="62.000" x2="202.000" y2="62.000" stroke-width="0.20"/><text class="tx" x="202.800" y="62.000" font-size="2.60" text-anchor="start" font-weight="bold" dominant-baseline="middle">4 × 凸台 14 × 14 R2</text><text class="tx" x="202.800" y="65.400" font-size="2.60" text-anchor="start" font-weight="bold" dominant-baseline="middle">4 × 底孔 Ø3.6 × 深 5</text><text class="tx2" x="202.800" y="68.800" font-size="2.50" text-anchor="start" font-weight="normal" dominant-baseline="middle">4 × 螺母 M3*4*3（嘉立创代嵌）</text><rect class="ln" x="268.000" y="30.000" width="146.000" height="200.000" rx="0.000" ry="0.000" fill="none" stroke-width="0.35"/><text class="tx" x="272.000" y="38.000" font-size="4.20" text-anchor="start" font-weight="bold" dominant-baseline="middle">技术要求</text><text class="tx" x="272.000" y="48.000" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">1.</text><text class="tx" x="277.000" y="48.000" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">螺母型号：M3*4*3（嘉立创「镶嵌螺母」列表第 4 项）</text><text class="tx" x="277.000" y="56.200" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">螺纹 M3 ／ 外径 Ø4.0 ／ 长度 3.0 ／ 材质 303 不锈钢</text><text class="tx" x="272.000" y="64.400" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">2.</text><text class="tx" x="277.000" y="64.400" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">螺母数量：4 件，位置 P1–P4，见左图及第 2 页详图。</text><text class="tx" x="272.000" y="72.600" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">3.</text><text class="tx" x="277.000" y="72.600" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">底孔：Ø3.6，深 5.0（与官方口径一致）。自凸台底面 Z 1.00 向上加工。</text><text class="tx" x="277.000" y="80.800" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">孔顶 Z 6.00，距面板外表面 7.98 还有 1.98，严禁钻穿正面。</text><text class="tx" x="272.000" y="89.000" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">4.</text><text class="tx" x="277.000" y="89.000" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">孔周壁厚 5.20（X / Y 均等），远超「螺母孔壁厚 ≥ 3 mm」要求。</text><text class="tx" x="277.000" y="97.200" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">凸台 14 × 14 本身即安装平面，压头无干涉。</text><text class="tx" x="272.000" y="105.400" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">5.</text><text class="tx" x="277.000" y="105.400" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">安装面：凸台 14 × 14 平面，满足「安装面 ≥ 14 × 14」要求</text><text class="tx" x="277.000" y="113.600" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">（凸台四周为开放空间，与内腔留 0.4 让位）。</text><text class="tx" x="272.000" y="121.800" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">6.</text><text class="tx" x="277.000" y="121.800" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">螺母压入后：端面与凸台底面齐平，允许低 0.1–0.2，</text><text class="tx" x="277.000" y="130.000" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">不得凸出（凸出会顶住背壳让位腔）。</text><text class="tx" x="272.000" y="138.200" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">7.</text><text class="tx" x="277.000" y="138.200" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">螺纹：压入后通规 M3-6H 通，止规不过。</text><text class="tx" x="272.000" y="146.400" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">8.</text><text class="tx" x="277.000" y="146.400" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">数量：前框 1 件（4 孔嵌螺母）。背壳同时下单，</text><text class="tx" x="277.000" y="154.600" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">其 4 处配作孔见第 3 页，两件同批打印。</text><text class="tx" x="272.000" y="162.800" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">9.</text><text class="tx" x="277.000" y="162.800" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">背壳与前框均由嘉立创 3D 打印 + 代嵌；前框嵌螺母，</text><text class="tx" x="277.000" y="171.000" font-size="2.90" text-anchor="start" font-weight="normal" dominant-baseline="middle">背壳只做沉孔/过孔/让位腔，不嵌螺母。</text><rect class="ln" x="268.000" y="236.000" width="146.000" height="14.000" rx="0.000" ry="0.000" fill="#f2f2f2" stroke-width="0.30"/><text class="tx" x="272.000" y="240.000" font-size="2.60" text-anchor="start" font-weight="normal" dominant-baseline="middle">坐标原点 = 前框外形中心；Z 0 = 设备背面贴合面</text><text class="tx2" x="272.000" y="246.000" font-size="2.50" text-anchor="start" font-weight="normal" dominant-baseline="middle">P1..P4 与背壳 4 处沉孔/过孔一一对应，同轴</text></svg></div><div class="page"><svg viewBox="0 0 420 297" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="hatch1" width="1.6" height="1.6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="1.6" stroke="#888" stroke-width="0.16"/></pattern></defs><rect class="frame" x="6.000" y="6.000" width="408.000" height="285.000" rx="0.000" ry="0.000" fill="none" stroke-width="0.60"/><rect class="frame" x="268.000" y="250.000" width="146.000" height="41.000" rx="0.000" ry="0.000" fill="none" stroke-width="0.50"/><line class="frame" x1="268.000" y1="262.000" x2="414.000" y2="262.000" stroke-width="0.35"/><line class="frame" x1="268.000" y1="274.000" x2="414.000" y2="274.000" stroke-width="0.35"/><line class="frame" x1="268.000" y1="282.000" x2="414.000" y2="282.000" stroke-width="0.25"/><line class="frame" x1="364.000" y1="262.000" x2="364.000" y2="291.000" stroke-width="0.35"/><text class="tx" x="271.000" y="256.000" font-size="4.20" text-ancho
